<!--
  Hero 右侧的动漫半身像占位图
  → 把你的动漫半身像命名为 hero-anime.png（或 .jpg / .webp），
    放到 public/images/ 下，然后在 src/config.ts 里把 HERO_IMAGE 改成
    '/images/hero-anime.png' 即可。
  → 建议尺寸：480 × 600（竖版 4:5），主体居中、上方留少量空隙。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" width="480" height="600" role="img" aria-label="动漫半身像占位图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe4e6" />
      <stop offset="50%" stop-color="#fae8ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#c4b5fd" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="480" height="600" fill="url(#bg)" />

  <!-- 装饰圆点 -->
  <circle cx="78" cy="96" r="10" fill="#fb7185" opacity="0.35" />
  <circle cx="404" cy="140" r="16" fill="#a78bfa" opacity="0.3" />
  <circle cx="392" cy="452" r="9" fill="#38bdf8" opacity="0.4" />
  <circle cx="96" cy="470" r="14" fill="#f472b6" opacity="0.28" />

  <!-- 虚线画框 -->
  <rect x="26" y="26" width="428" height="548" rx="28" fill="none" stroke="#fb7185" stroke-width="3" stroke-dasharray="12 10" opacity="0.65" />

  <!-- 身体 / 衣服 -->
  <path d="M120 600 C120 470 180 424 240 424 C300 424 360 470 360 600 Z" fill="url(#cloth)" opacity="0.95" />
  <!-- 领口 -->
  <path d="M212 428 L240 470 L268 428" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- 脖子 -->
  <rect x="222" y="356" width="36" height="72" rx="18" fill="#fde2d8" />

  <!-- 头 -->
  <ellipse cx="240" cy="268" rx="96" ry="108" fill="#fff1ea" />

  <!-- 头发：后层 -->
  <path d="M144 268 C144 178 186 136 240 136 C294 136 336 178 336 268 C336 236 300 206 240 206 C180 206 144 236 144 268 Z" fill="url(#hair)" />
  <!-- 头发：侧发 -->
  <path d="M148 250 C138 330 142 386 156 414 C160 372 158 316 168 270 Z" fill="url(#hair)" />
  <path d="M332 250 C342 330 338 386 324 414 C320 372 322 316 312 270 Z" fill="url(#hair)" />
  <!-- 刘海 -->
  <path d="M150 244 C158 168 196 140 240 140 C284 140 322 168 330 244 C316 200 282 178 240 178 C198 178 164 200 150 244 Z" fill="url(#hair)" />
  <path d="M176 190 C204 158 250 152 276 176 C258 172 232 176 214 194 Z" fill="#c4b5fd" opacity="0.7" />

  <!-- 眼睛 -->
  <g>
    <ellipse cx="204" cy="286" rx="15" ry="19" fill="#4c1d95" />
    <ellipse cx="276" cy="286" rx="15" ry="19" fill="#4c1d95" />
    <circle cx="209" cy="279" r="5.5" fill="#ffffff" />
    <circle cx="281" cy="279" r="5.5" fill="#ffffff" />
    <circle cx="200" cy="294" r="2.6" fill="#ffffff" opacity="0.75" />
    <circle cx="272" cy="294" r="2.6" fill="#ffffff" opacity="0.75" />
    <path d="M189 268 C196 260 210 260 217 266" stroke="#5b21b6" stroke-width="4" fill="none" stroke-linecap="round" />
    <path d="M263 266 C270 260 284 260 291 268" stroke="#5b21b6" stroke-width="4" fill="none" stroke-linecap="round" />
  </g>

  <!-- 腮红 -->
  <ellipse cx="180" cy="312" rx="17" ry="10" fill="#fb7185" opacity="0.38" />
  <ellipse cx="300" cy="312" rx="17" ry="10" fill="#fb7185" opacity="0.38" />

  <!-- 嘴 -->
  <path d="M231 322 C237 331 243 331 249 322" stroke="#e11d48" stroke-width="4.5" fill="none" stroke-linecap="round" />

  <!-- 提示文字 -->
  <rect x="86" y="524" width="308" height="46" rx="23" fill="#ffffff" opacity="0.82" />
  <text x="240" y="553" font-family="'PingFang SC','Microsoft YaHei',sans-serif" font-size="21" text-anchor="middle" fill="#e11d48">
    放你的动漫半身像 🖼️
  </text>
</svg>
